[workspace]
resolver = "2"
members = ["crates/core", "crates/advisor", "crates/onboarding", "crates/academy", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED" # licence commerciale à définir (voir LICENSES.md)
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
norelias-core = { path = "crates/core" }
norelias-advisor = { path = "crates/advisor" }
norelias-onboarding = { path = "crates/onboarding" }
norelias-academy = { path = "crates/academy" }

[profile.release]
opt-level = 3
lto = "thin"
